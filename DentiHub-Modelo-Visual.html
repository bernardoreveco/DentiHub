<title>DentiHub Modelo Visual</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concepto: suite de trabajo con riel de módulos a la izquierda (organización inspirada en suites colaborativas), identidad propia en azul petróleo, con módulos de terreno. Demo 100% navegable con datos de ejemplo. */
:root{
  --bg:#F3F5F7;--surface:#FFFFFF;--surface2:#EEF2F5;--line:#DDE3E8;
  --fg:#17222B;--muted:#5B6B78;
  --accent:#0E6E8C;--accent-soft:#DCEFF5;--on-accent:#FFFFFF;
  --ok:#1E7B4F;--ok-soft:#DFF1E7;--warn:#8A5A00;--warn-soft:#FBEBC8;--bad:#A3322B;--bad-soft:#F9E0DD;
  --display:"Segoe UI Semibold","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F161C;--surface:#17212A;--surface2:#1F2B35;--line:#2B3946;
  --fg:#E6EDF2;--muted:#93A4B2;
  --accent:#5CC0DE;--accent-soft:#16384A;--on-accent:#0B1A22;
  --ok:#6FD0A0;--ok-soft:#153B2B;--warn:#F0C466;--warn-soft:#43330F;--bad:#F29A92;--bad-soft:#4A1F1B;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F161C;--surface:#17212A;--surface2:#1F2B35;--line:#2B3946;
  --fg:#E6EDF2;--muted:#93A4B2;
  --accent:#5CC0DE;--accent-soft:#16384A;--on-accent:#0B1A22;
  --ok:#6FD0A0;--ok-soft:#153B2B;--warn:#F0C466;--warn-soft:#43330F;--bad:#F29A92;--bad-soft:#4A1F1B;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1120px;margin:0 auto}
.intro{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:12px}
.intro h1{font-family:var(--display);font-weight:600;font-size:22px;margin:0}
.intro p{margin:0;color:var(--muted);font-size:13px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;color:inherit}
.app{position:relative;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:600px}
.rail{width:76px;flex:none;overflow-y:auto;background:var(--surface2);border-right:1px solid var(--line);border-radius:12px 0 0 12px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 0}
.logo{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:600;margin-bottom:10px;flex:none}
.ri{width:64px;padding:7px 0;border:0;border-radius:9px;background:transparent;color:var(--muted);font:500 11px var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:none}
.ri:hover{background:var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ri.on{background:var(--accent-soft);color:var(--accent)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:relative;display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.sbox{position:relative;flex:1;min-width:0}
.sbox input{width:100%;font:14px var(--body);color:var(--fg);background:var(--surface2);border:1px solid transparent;border-radius:9px;padding:8px 12px 8px 34px}
.sbox svg{position:absolute;left:10px;top:9px;color:var(--muted)}
.sres{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:20;padding:4px;max-height:280px;overflow:auto}
.sres button,.menu button{display:flex;width:100%;justify-content:space-between;gap:8px;text-align:left;background:transparent;border:0;border-radius:7px;padding:8px 10px;cursor:pointer;font:13px var(--body)}
.sres button:hover,.menu button:hover{background:var(--surface2)}
.sres small{color:var(--muted)}
select,input,textarea{font:13px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 10px}
textarea{width:100%;resize:vertical}
.ib{position:relative;background:transparent;border:0;border-radius:9px;padding:6px;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ib:hover{background:var(--surface2)}
.badge{position:absolute;top:0;right:0;min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.menu{position:absolute;right:16px;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;z-index:30;padding:4px;width:min(300px,calc(100% - 32px))}
.menu .mh{padding:8px 10px;font-size:12px;color:var(--muted)}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none;border:0;cursor:pointer}
.banner{background:var(--warn-soft);color:var(--warn);font-size:12px;text-align:center;padding:4px 8px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;align-items:center}
.banner button{background:transparent;border:0;color:inherit;text-decoration:underline;cursor:pointer;font-size:12px}
.view{display:none;padding:20px;flex:1;min-width:0}
.view.show{display:block}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
h3{font-family:var(--display);font-weight:600;font-size:15px;margin:0 0 4px}
.sub{color:var(--muted);margin:2px 0 16px}
.hint{color:var(--muted);font-size:12px;margin:4px 0}
.err{color:var(--bad);font-size:12.5px;margin:6px 0}
.head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:20px}
.stat{background:var(--surface2);border:0;border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer}
.stat:hover{outline:1px solid var(--line)}
.stat small{color:var(--muted);font-size:12px;display:block}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.2}
.cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}
.clk{cursor:pointer}
.clk:hover{background:var(--surface2)}
.pill{font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:99px;white-space:nowrap}
.ok{background:var(--ok-soft);color:var(--ok)}.warn{background:var(--warn-soft);color:var(--warn)}.bad{background:var(--bad-soft);color:var(--bad)}.neu{background:var(--surface2);color:var(--muted)}
.btn{font:500 13px var(--body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px;white-space:nowrap}
.btn.dng{color:var(--bad)}
.act-links p{margin:0 0 10px;color:var(--muted);font-size:13px;cursor:pointer}
.act-links p:hover{color:var(--fg)}
.act-links b{color:var(--fg);font-weight:600}.act-links em{font-style:normal;color:var(--accent)}
.qa{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:0 0 16px}
.seg button{font:500 13px var(--body);color:var(--muted);background:var(--surface);border:0;padding:7px 14px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kcol{background:var(--surface2);border-radius:10px;padding:10px;min-height:120px}
.kcol h3{font-size:13px;display:flex;justify-content:space-between}
.kcard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:8px;font-size:13px;cursor:pointer}
.kcard small{display:block;color:var(--muted);margin-top:2px}
.calw{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;min-width:560px}
.cday{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:130px}
.cday b{font-size:12px;color:var(--muted);font-weight:600}
.chip{display:block;width:100%;text-align:left;font-size:12px;border:0;border-radius:6px;padding:3px 6px;margin-top:6px;cursor:pointer}
.phone{max-width:340px;margin:0 auto;border:1px solid var(--line);border-radius:26px;padding:18px 16px;background:var(--surface2)}
.chk{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;cursor:pointer;font:14px var(--body)}
.chk.done svg{color:var(--ok)}
.photo{display:flex;align-items:center;gap:8px;margin:12px 0;padding:10px;border-radius:9px;background:var(--ok-soft);color:var(--ok);flex-wrap:wrap}
.mact{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px}
.qr{display:flex;align-items:center;gap:14px;margin:16px auto 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:340px}
.qr p{margin:0 0 6px;font-size:12.5px;color:var(--muted)}
.chat{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px}
.ch{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:7px 10px;border-radius:8px;background:transparent;border:0;cursor:pointer;font:14px var(--body)}
.ch:hover{background:var(--surface2)}
.ch.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.lbl{font-size:12px;color:var(--muted);font-weight:600;margin:14px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.msgs{min-height:260px}
.bub{background:var(--surface2);border-radius:12px;padding:9px 12px;max-width:min(520px,88%);margin-bottom:8px}
.bub.me{margin-left:auto;background:var(--accent-soft);color:var(--accent)}
.composer{display:flex;gap:8px;margin-top:14px}
.composer input{flex:1;min-width:0}
.mwrap{position:relative;flex:1;min-width:0;display:flex}
.mwrap input{flex:1;min-width:0}
.sugg{position:absolute;left:0;bottom:100%;margin-bottom:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;z-index:10;min-width:180px}
.sugg button{display:block;width:100%;text-align:left;background:transparent;border:0;border-radius:7px;padding:6px 10px;cursor:pointer;font:13px var(--body)}
.sugg button:hover{background:var(--surface2)}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:12px;color:var(--muted)}
.crumbs button{background:transparent;border:0;color:var(--accent);cursor:pointer;font:500 13px var(--body);padding:2px 4px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);margin-bottom:12px;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px}
.fcard:hover{background:var(--surface2)}
.gridw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.grid{border-collapse:collapse;width:100%;min-width:640px}
table.grid th{background:var(--surface2);text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;position:relative}
table.grid td:last-child{border-right:0}
table.grid td input,table.grid td select{width:100%;border:0;border-radius:0;background:transparent;padding:8px;font-size:13px}
table.grid td .lk{padding:8px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cur{position:absolute;top:-1px;left:-1px;z-index:2;font-size:10px;padding:1px 6px;border-radius:0 0 6px 0;color:var(--on-accent);pointer-events:none}
.pres{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.pres .av{width:24px;height:24px;font-size:10px;cursor:default}
.fx{margin:10px 0;padding:6px 10px;background:var(--surface2);border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--muted)}
.docs{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}
.tb2{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.editor{border:1px solid var(--line);border-radius:10px;padding:16px;min-height:280px;background:var(--surface)}
.editor:focus{outline:2px solid var(--accent)}
.coed{font-size:12px;color:var(--accent);min-height:18px;margin-top:6px}
.cm{background:var(--surface2);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.wiki{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px}
.tree button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:8px;background:transparent;border:0;cursor:pointer;font:14px var(--body)}
.tree button:hover{background:var(--surface2)}
.tree button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}
.tree .sec{font-size:12px;color:var(--muted);font-weight:600;margin-top:10px;text-transform:uppercase;letter-spacing:.04em;padding-left:10px}
.note{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;margin:12px 0}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent)}
.pie{width:130px;height:130px;border-radius:50%;flex:none}
.card2{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.sw{width:38px;height:22px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:left .15s}
.sw.on{background:var(--accent)}
.sw.on::after{left:19px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
table.tbl td{padding:8px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(560px,100%);max-height:88vh;overflow:auto}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.fld{display:block;margin-bottom:10px;font-size:12.5px;color:var(--muted)}
.fld input,.fld select,.fld textarea{display:block;width:100%;margin-top:4px;color:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;max-width:calc(100% - 32px)}
.login{position:absolute;inset:0;z-index:40;background:var(--bg);border-radius:12px;display:grid;place-items:center;padding:16px}
.lbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.lbox input{width:100%;margin:4px 0 10px}
.pv{background:#fff;color:#222;border-radius:8px;padding:18px;border:1px solid var(--line)}
.pv i{display:block;height:8px;background:#d9dee3;border-radius:4px;margin:10px 0}
@media (max-width:760px){
  .app{flex-direction:column}
  .rail{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;justify-content:flex-start;padding:8px;border-right:0;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0}
  .logo{margin:0 6px 0 0}
  .cols,.chat,.docs,.wiki,.kan{grid-template-columns:minmax(0,1fr)}
  .view{padding:16px}
  .top{flex-wrap:wrap}
  .sbox{flex:1 1 100%;order:-1}
  #rol{flex:1;min-width:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">

/* ---------- modal ---------- */
function showModal(fn){S.modalFn=fn;drawModal()}

function closeModal(){$('#modal').hidden=true;S.modalFn=null}

/* ---------- navegación ---------- */
function allowed(v){var b=$('#rail [data-v="'+v+'"]');if(!b)return false;var r=b.dataset.r;return !r||(r==='mgr'&&isMgr())||(r==='admin'&&S.rol==='admin')}
function go(v){
  if(!allowed(v))v='inicio';
  S.view=v;
  $$('#rail .ri').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  $$('.view').forEach(function(e){e.classList.remove('show')});
  $('#v-'+v).classList.add('show');
  R[v]();
  $('#bellmenu').hidden=true;$('#avmenu').hidden=true;
}
function rerender(){R[S.view]();if(S.modalFn)drawModal()}
function applyRole(){
  $$('#rail [data-r]').forEach(function(b){b.hidden=!allowed(b.dataset.v)});
  $('#avb').textContent=INI[S.rol];
  if(!allowed(S.view))S.view='inicio';

}

/* archivos */
function folderNode(){var list=S.fs;for(var i=0;i<S.path.length;i++){var f=list.filter(function(x){return x.n===S.path[i]})[0];if(!f)return list;list=f.k}return list}

  function item(x,i){
    var isF=!!x.k;
    var meta=isF?(x.k.length+' elementos'):x.s;
    var perm=x.lock?'<span class="pill warn">Solo Gestión</span>':'';
    if(S.fv==='grid')return '<div class="fcard" data-act="openF" data-i="'+i+'">'+ic(isF?'folder':(x.t==='img'?'img':'doc'),26)+'<b style="font-weight:500">'+esc(x.n)+'</b><small style="color:var(--muted)">'+meta+'</small>'+perm+'</div>';
    return '<div class="row clk" data-act="openF" data-i="'+i+'">'+ic(isF?'folder':(x.t==='img'?'img':'doc'))+'<span class="t">'+esc(x.n)+'</span>'+perm+'<small style="color:var(--muted)">'+meta+'</small><button class="btn sm dng" data-act="delF" data-i="'+i+'" aria-label="Eliminar">'+ic('trash',14)+'</button></div>';

  '<div class="seg"><button class="'+(S.fv==='lista'?'on':'')+'" data-act="fv" data-v="lista">Lista</button><button class="'+(S.fv==='grid'?'on':'')+'" data-act="fv" data-v="grid">Cuadrícula</button></div>'+cr+
  '<div class="drop" id="drop" data-act="upload">Arrastra archivos aquí o haz clic para subir (simulado)</div>'+
  (list.length?(S.fv==='grid'?'<div class="fgrid">'+list.map(item).join('')+'</div>':list.map(item).join('')):'<p class="sub">Esta carpeta está vacía.</p>');

  dz.addEventListener('dragleave',function(){dz.classList.remove('over')});
  dz.addEventListener('drop',function(e){e.preventDefault();dz.classList.remove('over');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];addFile(f?f.name:null,f?Math.max(1,Math.round(f.size/1024))+' KB':null)});
};
function addFile(name,size){

}
function fileViewer(x){

var curTimer=null;
function moveCursors(){
  if(S.view!=='plan'||S.psv!=='grid')return;
  $$('.cur').forEach(function(e){e.remove()});
  var tds=$$('table.grid tbody td');if(!tds.length)return;
  [['Ana P.','var(--accent)'],['Diego F.','var(--ok)']].forEach(function(p){
    var td=tds[Math.floor(Math.random()*tds.length)];
    var s=document.createElement('span');s.className='cur';s.style.background=p[1];s.textContent=p[0];td.appendChild(s);
  });
}

/* tareas */
function taskBody(t){
  var h='<div class="tb"><p class="sub" style="margin:0 0 6px">'+esc(t.who)+' · '+DAYS[t.d]+(t.rec?' · '+esc(t.rec):'')+'</p>';
  h+=t.steps.map(function(s,i){return '<button class="chk'+(s.ok?' done':'')+'" data-act="step" data-id="'+t.id+'" data-i="'+i+'">'+ic(s.ok?'boxc':'box')+'<span>'+esc(s.t)+'</span></button>'}).join('');
  h+=t.foto?'<div class="photo">'+ic('img',20)+'Foto de evidencia adjunta'+(t.sync?' <span class="pill warn">Pendiente de sincronizar</span>':'')+'</div>'
    :'<button class="btn" style="margin:12px 0 4px" data-act="foto" data-id="'+t.id+'">'+ic('cam',17)+'Adjuntar foto de evidencia</button><p class="hint">La foto es obligatoria para completar.</p>';
  h+='<p class="err merr" hidden></p><div class="mact"><label style="font-size:12.5px;color:var(--muted)">Estado <select data-chg="estado" data-id="'+t.id+'">'+ESTADOS.map(function(e){return '<option'+(e===t.est?' selected':'')+'>'+e+'</option>'}).join('')+'</select></label>'+
    (t.est==='Hecho'?'<span class="pill ok">Completada</span>':'<button class="btn pri" data-act="doneTask" data-id="'+t.id+'">Completar tarea</button>')+'</div></div>';
  return h;
}

/* reportes */
R.rep=function(){
  var cnt={Hecho:0,'En curso':0,Pendiente:0};S.tasks.forEach(function(t){cnt[t.est]++});
  var tot=S.tasks.length,a=Math.round(cnt.Hecho/tot*100),b=a+Math.round(cnt['En curso']/tot*100);
  var by={};S.tasks.forEach(function(t){var o=by[t.who]=by[t.who]||{h:0,t:0};o.t++;if(t.est==='Hecho')o.h++});
  $('#v-rep').innerHTML=viewHead('Reportes','Cumplimiento y alertas automáticas.')+
  '<div class="stats"><div class="stat"><small>Cumplimiento general</small><b>'+a+'%</b></div><div class="stat"><small>Tareas urgentes</small><b style="color:var(--bad)">'+S.tasks.filter(function(t){return t.urg}).length+'</b></div><div class="stat"><small>Aprobaciones pendientes</small><b>'+S.reqs.filter(function(r){return r.est==='Pendiente'}).length+'</b></div></div>'+
  '<div class="cols"><div class="card2"><h3>Cumplimiento por técnico</h3>'+Object.keys(by).map(function(n){var p=Math.round(by[n].h/by[n].t*100);return '<div class="row"><span style="width:90px">'+esc(n)+'</span><div class="bar"><i style="width:'+p+'%"></i></div><b style="font-weight:500;width:40px;text-align:right">'+p+'%</b></div>'}).join('')+'</div>'+
  '<div class="card2" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div class="pie" style="background:conic-gradient(var(--ok) 0 '+a+'%,var(--warn) '+a+'% '+b+'%,var(--line) '+b+'% 100%)" role="img" aria-label="Tareas por estado"></div><div style="font-size:13px"><p style="margin:0 0 4px"><span class="pill ok">Hecho</span> '+cnt.Hecho+'</p><p style="margin:0 0 4px"><span class="pill warn">En curso</span> '+cnt['En curso']+'</p><p style="margin:0"><span class="pill neu">Pendiente</span> '+cnt.Pendiente+'</p></div></div></div>'+
  '<div class="card2"><div class="head"><h3>Alertas automáticas</h3><div><button class="btn sm" data-act="newRule">'+ic('plus',14)+'Nueva regla</button> <button class="btn sm" data-act="simAlert">Simular: C-03 defectuosa</button></div></div>'+
  S.rules.map(function(r,i){return '<div class="row"><span class="t">'+esc(r.t)+'</span><button class="sw'+(r.on?' on':'')+'" data-act="rule" data-i="'+i+'" role="switch" aria-checked="'+r.on+'" aria-label="Activar regla"></button></div>'}).join('')+'</div>';
};

  addRow:function(){S.sh.push(['Nuevo equipo','Cliente',techs()[0],'Pendiente',DAYS[0],0]);log('agregó una fila','Planillas');rerender()},
  tv:function(b){S.tv=b.dataset.v;rerender()},
  openTask:function(b){var t=taskById(b.dataset.id);if(S.view!=='tareas'&&b.closest('#v-wiki')){}showModal(function(){var x=taskById(t.id);return {title:x.t,html:taskBody(x)}})},
  scan:function(){toast('QR leído: Compresor C-03');showModal(function(){var x=taskById(4);return {title:'Checklist · '+x.t,html:taskBody(x)}})},
  step:function(b){var t=taskById(b.dataset.id),s=t.steps[+b.dataset.i];s.ok=!s.ok;if(t.est==='Pendiente'&&s.ok)t.est='En curso';rerender()},
  foto:function(b){var t=taskById(b.dataset.id);t.foto=true;t.sync=!S.online;toast(S.online?'Foto adjuntada':'Sin conexión: la foto queda guardada en el celular');log('adjuntó una foto en "'+t.t+'"','Tareas');rerender()},
  doneTask:function(b){
    var t=taskById(b.dataset.id),box=b.closest('.tb'),e=box.querySelector('.merr');
    if(!t.steps.every(function(s){return s.ok})||!t.foto){e.textContent='Marca todos los pasos y adjunta la foto de evidencia para completar.';e.hidden=false;return}
    t.est='Hecho';log('completó "'+t.t+'"','Tareas');notify('Completaste "'+t.t+'"');toast('Tarea completada');rerender();
  },
  newTask:function(){showModal(function(){return {title:'Nueva tarea',html:'<label class="fld">Título<input id="nt" placeholder="Ej: Revisión de bomba P-02"></label><label class="fld">Responsable<select id="nw">'+techs().map(function(n){return '<option>'+n+'</option>'}).join('')+'</select></label><label class="fld">Día<select id="nd">'+DAYS.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('')+'</select></label><label class="fld">Repetición<select id="nr"><option value="">Una sola vez</option><option>Diaria</option><option>2 veces al día</option><option>Semanal</option></select></label><label class="fld">Pasos del checklist (uno por línea)<textarea id="ns" rows="3">Paso 1\nPaso 2</textarea></label><p class="err merr" hidden></p><div class="mact"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="saveTask">Crear tarea</button></div>'}})},
  saveTask:function(){
    var t=$('#nt').value.trim();if(!t){merr('Escribe un título para la tarea.');return}
    var steps=$('#ns').value.split('\n').map(function(x){return x.trim()}).filter(Boolean).map(function(x){return {t:x,ok:false}});
    if(!steps.length)steps=[{t:'Completar',ok:false}];
    S.tasks.push({id:Date.now(),t:t,who:$('#nw').value,est:'Pendiente',d:+$('#nd').value,rec:$('#nr').value,urg:false,foto:false,sync:false,steps:steps});
    log('creó la tarea "'+t+'"','Tareas');closeModal();toast('Tarea creada');rerender();
  },
  newReq:function(){showModal(function(){return {title:'Nueva solicitud',html:'<label class="fld">¿Qué necesitas?<input id="rt" placeholder="Ej: Compra de repuesto"></label><label class="fld">Detalle o monto<input id="rd" placeholder="Ej: Costo estimado $30.000"></label><p class="err merr" hidden></p><div class="mact"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="saveReq">Enviar solicitud</button></div>'}})},
  saveReq:function(){var t=$('#rt').value.trim();if(!t){merr('Describe qué necesitas.');return}S.reqs.unshift({id:Date.now(),t:t,who:cur(),d:$('#rd').value.trim()||'Sin detalle',est:'Pendiente'});log('envió la solicitud "'+t+'"','Aprobaciones');closeModal();toast('Solicitud enviada');rerender()},
  apr:function(b){var r=S.reqs.filter(function(x){return x.id===+b.dataset.id})[0],ok=b.dataset.d==='ok';r.est=ok?'Aprobada':'Rechazada';log((ok?'aprobó':'rechazó')+' "'+r.t+'"','Aprobaciones');notify(r.who+': tu solicitud "'+r.t+'" fue '+(ok?'aprobada':'rechazada'));toast(ok?'Solicitud aprobada':'Solicitud rechazada');rerender()},
  addCm:function(){var i=$('#cmin'),v=i.value.trim(),e=$('#cmerr');if(!v){e.textContent='Escribe un comentario.';e.hidden=false;return}S.cm.push({u:cur(),t:v});log('comentó en el informe técnico','Documentos');R.docs()},
  wp:function(b){S.wp=b.dataset.k;S.wedit=false;R.wiki()},
  wedit:function(){if(S.wedit){WIKI[S.wp].b=$('#wb').innerHTML;log('editó la página "'+WIKI[S.wp].t+'"','Wiki');toast('Página guardada')}S.wedit=!S.wedit;R.wiki()},
  rule:function(b){var r=S.rules[+b.dataset.i];r.on=!r.on;log((r.on?'activó':'desactivó')+' una regla de alerta','Reportes');R.rep()},
  newRule:function(){showModal(function(){return {title:'Nueva regla',html:'<label class="fld">Cuando…<select id="rw"><option>una máquina se marque como Defectuosa</option><option>una tarea venza sin completar</option><option>una aprobación lleve 2 días pendiente</option></select></label><label class="fld">Avisar a…<select id="ra"><option>#Urgencias</option><option>#Mantenimiento</option><option>el Gestor</option></select></label><div class="mact"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="saveRule">Crear regla</button></div>'}})},
  saveRule:function(){S.rules.push({t:'Si '+$('#rw').value+', avisar a '+$('#ra').value,on:true});log('creó una regla de alerta','Reportes');closeModal();toast('Regla creada');R.rep()},
  simAlert:function(){
    if(!S.rules[0].on){toast('La regla está desactivada: no se envió alerta');return}
    S.chs.urg.msgs.push({u:'Sistema',t:'Alerta: Máquina C-03 marcada como defectuosa (simulación).'});
    notify('Alerta enviada a #Urgencias: C-03 defectuosa');log('disparó una alerta de prueba','Reportes');toast('Alerta enviada a #Urgencias');
  },
  at:function(b){S.at=b.dataset.v;R.admin()},
  invite:function(){showModal(function(){return {title:'Invitar usuario',html:'<label class="fld">Correo<input id="ie" type="email" placeholder="nombre@empresa.cl"></label><label class="fld">Rol<select id="ir"><option>Técnico</option><option>Gestor</option><option>Administrador</option></select></label><label class="fld">Área<input id="ia" placeholder="Ej: Terreno Norte"></label><p class="err merr" hidden></p><div class="mact"><button class="btn" data-act="closeModal">Cancelar</button><button class="btn pri" data-act="saveInvite">Enviar invitación</button></div>'}})},
  saveInvite:function(){var m=$('#ie').value.trim();if(!/^\S+@\S+\.\S+$/.test(m)){merr('Ingresa un correo válido.');return}var n=m.split('@')[0];S.users.push({n:n.charAt(0).toUpperCase()+n.slice(1),m:m,r:$('#ir').value,a:$('#ia').value.trim()||'Sin área',st:'Invitado'});log('invitó a '+m,'Administración');closeModal();toast('Invitación enviada');R.admin()},
  ust:function(b){var u=S.users[+b.dataset.i];u.st=u.st==='Activo'?'Inactivo':'Activo';log((u.st==='Activo'?'activó a ':'desactivó a ')+u.n,'Administración');R.admin()},
  net:function(){
    S.online=!S.online;updNet();
    if(S.online){var n=0;S.tasks.forEach(function(t){if(t.sync){t.sync=false;n++}});if(n){toast(n+' evidencia(s) sincronizada(s)');log('sincronizó '+n+' evidencia(s)','Tareas')}else toast('Conexión restablecida')}
    else toast('Modo sin conexión: lo que subas se sincroniza al volver');
    rerender();
  },
  bell:function(){var m=$('#bellmenu');$('#avmenu').hidden=true;m.innerHTML='<div class="mh">Notificaciones</div>'+(S.notifs.length?S.notifs.map(function(n){return '<div class="mh" style="color:var(--fg)">'+esc(n)+'</div>'}).join('')+'<button data-act="clearN">Marcar como leídas</button>':'<div class="mh">Sin notificaciones nuevas</div>');m.hidden=!m.hidden},
  clearN:function(){S.notifs=[];updBell();$('#bellmenu').hidden=true},
  avmenu:function(){var m=$('#avmenu');$('#bellmenu').hidden=true;m.innerHTML='<div class="mh">'+esc(cur())+' · '+ROLN[S.rol]+'</div><button data-act="logout">Cerrar sesión</button>';m.hidden=!m.hidden},
  logout:function(){$('#avmenu').hidden=true;loginView('cred')},
  lcred:function(){var e=$('#le').value.trim(),p=$('#lp').value;if(!e||!p){lerr('Ingresa tu correo y tu contraseña.');return}loginView('code')},
  lgoogle:function(){loginView('code')},
  lcode:function(){if(!/^\d{6}$/.test($('#lc').value)){lerr('El código tiene 6 dígitos.');return}$('#login').hidden=true;toast('Sesión iniciada')},
  lforgot:function(){loginView('rec')},
  lrec:function(){if(!$('#le').value.trim()){lerr('Ingresa tu correo.');return}toast('Si el correo existe, enviamos un enlace');loginView('cred')},
  lback:function(){loginView('cred')},
  sr:function(b){
    var x=S.sr[+b.dataset.i];$('#sres').hidden=true;$('#q').value='';
    if(x.a==='openTask')A.openTask({dataset:{id:x.id},closest:function(){return null}});
    else if(x.a==='wiki'){S.wp=x.id;S.wedit=false;go('wiki')}
    else go(x.v);
  },
  sugOpen:function(){showModal(function(){
    return {title:'Sugerir un cambio',html:'<p class="hint">Pantalla actual: <b>'+esc(viewName())+'</b>. Lo que escribas aquí queda en este navegador; usa “Copiar resumen” para compartirlo con el equipo.</p><label class="fld">Tipo<select id="sk"><option>Cambiar</option><option>Agregar</option><option>Quitar</option></select></label><label class="fld">Tu sugerencia<textarea id="st" rows="3"></textarea></label><p class="err merr" hidden></p><div class="mact"><button class="btn pri" data-act="sugSave">Guardar sugerencia</button><button class="btn" data-act="sugCopy">Copiar resumen ('+S.sugs.length+')</button></div>'+
    (S.sugs.length?'<h3 style="margin-top:14px">Guardadas</h3>'+S.sugs.map(function(s){return '<div class="cm"><b>'+esc(s.k)+' · '+esc(s.v)+'</b><br>'+esc(s.t)+'</div>'}).join(''):'')}})},
  sugSave:function(){var t=$('#st').value.trim();if(!t){merr('Escribe tu sugerencia.');return}S.sugs.push({k:$('#sk').value,v:viewName(),t:t});$('#sugN').textContent=S.sugs.length;toast('Sugerencia guardada');drawModal()},
  sugCopy:function(){
    var txt=S.sugs.map(function(s,i){return (i+1)+'. ['+s.k+' · '+s.v+'] '+s.t}).join('\n')||'Sin sugerencias aún.';
    try{navigator.clipboard.writeText(txt).then(function(){toast('Resumen copiado')},function(){toast('No se pudo copiar; selecciona el texto manualmente')})}catch(e){toast('No se pudo copiar; selecciona el texto manualmente')}
  }
};
function viewName(){var b=$('#rail [data-v="'+S.view+'"]');return b?b.textContent.trim():'Inicio'}
function updNet(){var n=$('#net');n.innerHTML=ic('wifi',15)+(S.online?'En línea':'Sin conexión');n.className='btn sm '+(S.online?'':'warn')}

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(b&&A[b.dataset.act]){A[b.dataset.act](b,e);return}
  var c=e.target.closest('[data-cmd]');
  if(!c&&!e.target.closest('.sbox'))$('#sres').hidden=true;
  if(!e.target.closest('.menu')&&!e.target.closest('[data-act="bell"]')&&!e.target.closest('[data-act="avmenu"]')){$('#bellmenu').hidden=true;$('#avmenu').hidden=true}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('mousedown',function(e){
  var c=e.target.closest('[data-cmd]');if(!c)return;
  e.preventDefault();
  try{document.execCommand(c.dataset.cmd,false,c.dataset.val||null)}catch(x){}
  var ed=$('#ed');if(ed)S.doc=ed.innerHTML;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('cell')){
    var r=+t.dataset.r,c=+t.dataset.c;S.sh[r][c]=c===5?(+t.value||0):t.value;
    log('editó la celda '+'ABCDEF'.charAt(c)+(r+1)+' de la planilla','Planillas');
    if(c===5||c===3)R.plan();
    return;
  }
  var k=t.dataset&&t.dataset.chg;if(!k)return;
  if(k==='shf'){S.shf=t.value;R.plan()}
  else if(k==='af'){S.af=t.value;R.admin()}
  else if(k==='urol'){var u=S.users[+t.dataset.i];u.r=t.value;log('cambió el rol de '+u.n+' a '+t.value,'Administración');toast('Rol actualizado')}
  else if(k==='estado'){var x=taskById(t.dataset.id);x.est=t.value;log('cambió "'+x.t+'" a '+t.value,'Tareas');rerender()}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='ed'){S.doc=el.innerHTML;var s=$('#saved');if(s){s.textContent='Guardado';}return}
  if(el.id==='q'){
    var q=el.value.trim().toLowerCase(),box=$('#sres');
    if(q.length<2){box.hidden=true;return}
    var idx=[];
    myTasks().forEach(function(t){idx.push({l:t.t,k:'Tarea',a:'openTask',id:t.id})});
    allFiles().forEach(function(f){idx.push({l:f.n,k:'Archivo',a:'go',v:'arch'})});
    Object.keys(WIKI).forEach(function(k){idx.push({l:WIKI[k].t,k:'Wiki',a:'wiki',id:k})});
    S.users.forEach(function(u){idx.push({l:u.n,k:'Persona',a:'go',v:'msj'})});
    S.sr=idx.filter(function(x){return x.l.toLowerCase().indexOf(q)>-1}).slice(0,8);
    box.innerHTML=S.sr.length?S.sr.map(function(x,i){return '<button data-act="sr" data-i="'+i+'"><span>'+esc(x.l)+'</span><small>'+x.k+'</small></button>'}).join(''):'<div class="mh" style="padding:8px 10px;color:var(--muted)">Sin resultados</div>';
    box.hidden=false;return;
  }
  if(el.matches&&el.matches('[data-mention]')){
    var m=/@([\wÁÉÍÓÚáéíóúñÑ]*)$/.exec(el.value),sg=el.parentNode.querySelector('.sugg');if(!sg)return;
    if(!m){sg.hidden=true;return}
    var qq=m[1].toLowerCase(),l=S.users.filter(function(u){return u.n.toLowerCase().indexOf(qq)===0}).slice(0,5);
    sg.innerHTML=l.map(function(u){return '<button data-act="mention" data-n="'+esc(u.n)+'">@'+esc(u.n)+'</button>'}).join('');
    sg.hidden=!l.length;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeModal();$('#sres').hidden=true}
  if(e.key==='Enter'&&e.target.id==='msgin'){e.preventDefault();A.send()}
});
$('#rol').addEventListener('change',function(){S.rol=this.value;applyRole();toast('Ahora ves la app como '+ROLN[S.rol])});

/* simulación de colaboración */
setInterval(moveCursors,3000);
setInterval(function(){
  if(S.view!=='docs')return;
  var c=$('#coed');if(!c)return;
  c.textContent=c.textContent?'':'Ana P. está escribiendo…';
},3500);

updNet();updBell();applyRole();
})();
</script>
